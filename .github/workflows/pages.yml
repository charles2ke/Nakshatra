name: Deploy portal to GitHub Pages

on:
  # Every push to main redeploys the portal. Without this the legacy
  # "pages build and deployment" job could publish the repository README
  # instead of the built site.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Switch the Pages source to GitHub Actions. While the repository is on
      # the legacy branch-based source, Pages publishes a Jekyll-rendered
      # README.md instead of the portal built below.
      - name: Use this workflow as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/pages" -f build_type=workflow ||
            gh api -X PUT "repos/$REPO/pages" -f build_type=workflow ||
            echo "::warning::Could not set the Pages source to GitHub Actions; set Settings -> Pages -> Source to 'GitHub Actions' manually."
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      # GitHub Pages has no SPA rewrite rule; serving index.html as the 404
      # page keeps client-side routes such as /search working on reload.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
