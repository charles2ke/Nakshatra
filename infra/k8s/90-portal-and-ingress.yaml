# Ingress for the portal and the API gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nakshatra
  namespace: nakshatra
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
spec:
  rules:
    - host: portal.nakshatra.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: nakshatra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/charles2ke/nakshatra-portal:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: nakshatra
spec:
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portal
  namespace: nakshatra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
