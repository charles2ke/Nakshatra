# Generated deployment for the inventory service.
# Stateless: all state lives in MongoDB/Redis/Kafka, so replicas scale horizontally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: nakshatra
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: nakshatra
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: nakshatra
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: ghcr.io/charles2ke/nakshatra-inventory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: nakshatra-config
            - secretRef:
                name: nakshatra-secrets
          env:
            - name: SERVICE_NAME
              value: inventory
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: nakshatra
spec:
  selector:
    app.kubernetes.io/name: inventory
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Horizontal Pod Autoscaler: scales on CPU and memory utilisation.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory
  namespace: nakshatra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory
  namespace: nakshatra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
